name: CI

# Build + test on every push to master and every PR targeting it.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A newer commit on the same ref cancels the in-flight run — saves minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Real SQL Server so the integration tests exercise the same engine as prod
    # (migrations, ExecuteUpdateAsync, query splitting) — not a faked provider.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test!Pass123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test!Pass123' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restoring the test project pulls MVC + BLL + DAL + Core transitively;
      # the API is restored separately so it's covered by the build too.
      - name: Restore
        run: |
          dotnet restore Stylebazar.Tests/Stylebazar.Tests.csproj
          dotnet restore Stylebazar.API/Stylebazar.API.csproj

      - name: Build
        run: |
          dotnet build Stylebazar.Tests/Stylebazar.Tests.csproj -c Release --no-restore
          dotnet build Stylebazar.API/Stylebazar.API.csproj -c Release --no-restore

      # The factory reads TEST_DB_CONNECTION and points the app at the service
      # container; the app's startup MigrateAsync creates + migrates the DB.
      - name: Test (unit + integration)
        env:
          TEST_DB_CONNECTION: "Server=localhost,1433;Database=StyleBazarDb_Test;User Id=sa;Password=Test!Pass123;TrustServerCertificate=True;Encrypt=False"
        run: >-
          dotnet test Stylebazar.Tests/Stylebazar.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  publish:
    name: Publish artifacts
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'   # only on master, not on PRs
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish MVC + API
        run: |
          dotnet publish Stylebazar.MVC/Stylebazar.MVC.csproj -c Release -o publish/mvc
          dotnet publish Stylebazar.API/Stylebazar.API.csproj -c Release -o publish/api

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: stylebazar-app
          path: publish/

      # ── Deploy ──
      # Wire a real target here when infra is chosen. Examples:
      #   - Azure App Service:  azure/webapps-deploy@v3 (publish-profile secret)
      #   - SSH + systemd:       rsync publish/ then `systemctl restart`
      # Keep it gated behind an Environment with required reviewers so a master
      # push never auto-ships to prod without a human approve.

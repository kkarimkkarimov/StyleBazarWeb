# Local full-stack: SQL Server + MVC + API.
#   docker compose up --build
#   MVC → http://localhost:8080   API → http://localhost:8081 (Scalar at /scalar)
#
# Runs in Development so the dev secret fallbacks (Jwt key, admin password) apply
# and HTTPS redirect/HSTS stay off — production deploys inject real secrets per
# DEPLOYMENT.md instead.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local!Dev!Pass1"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Local!Dev!Pass1' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mvc:
    build:
      context: .
      dockerfile: Stylebazar.MVC/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StyleBazarDb;User Id=sa;Password=Local!Dev!Pass1;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - mvc_uploads:/app/wwwroot/uploads
      - mvc_keys:/app/keys

  api:
    build:
      context: .
      dockerfile: Stylebazar.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StyleBazarDb;User Id=sa;Password=Local!Dev!Pass1;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mvc:
        # Let the MVC app apply migrations first so the two don't race on boot.
        condition: service_started
    volumes:
      - api_uploads:/app/wwwroot/uploads

volumes:
  sqldata:
  mvc_uploads:
  mvc_keys:
  api_uploads:
